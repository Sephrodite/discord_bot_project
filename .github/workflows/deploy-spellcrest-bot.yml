name: Deploy SpellCrest Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-spellcrest-bot
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VM_HOST: 136.66.172.43
      VM_USER: thomashillebrink

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSH key
        shell: bash
        env:
          SSH_KEY_B64: ${{ secrets.SPELLCREST_VM_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/spellcrest_key
          chmod 600 ~/.ssh/spellcrest_key

      - name: Add VM to known_hosts
        shell: bash
        run: |
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH connection
        shell: bash
        run: |
          ssh -o IdentitiesOnly=yes \
              -i ~/.ssh/spellcrest_key \
              "$VM_USER@$VM_HOST" \
              "whoami && hostname"

      - name: Deploy to SpellCrest VM
        shell: bash
        run: |
          ssh -o IdentitiesOnly=yes \
              -i ~/.ssh/spellcrest_key \
              "$VM_USER@$VM_HOST" \
              "~/deploy-spellcrest-bot.sh"
